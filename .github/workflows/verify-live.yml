name: verify-live

# Read-only live smoke against the deployed app, hitting the LIST endpoint of
# EVERY module mount (see server/scripts/ci/moduleSmoke.mjs). Purely GET — it
# never writes to the shared Atlas database.
#
# Run manually via Actions → "verify-live" → Run workflow, or on the schedule.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   LIVE_BASE       = https://int-erp.onrender.com/api
#   ADMIN_EMAIL     = admin@dsu.edu   (or another admin account)
#   ADMIN_PASSWORD  = that account's password
on:
  workflow_dispatch:
  schedule:
    # 03:1X nightly — deliberately off the :00/:30 marks.
    - cron: '13 3 * * *'

jobs:
  smoke:
    name: Every-module list smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # The secrets context is not usable in a job/step `if:` — surface it as job
    # env vars first, then gate the run step on env.* below. Unset secrets
    # resolve to '' so the smoke step cleanly skips (never fails red) until the
    # repo admin secrets exist.
    env:
      LIVE_BASE: ${{ secrets.LIVE_BASE }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Skip — admin secrets not configured
        if: env.ADMIN_EMAIL == '' || env.ADMIN_PASSWORD == ''
        run: echo "ADMIN_EMAIL / ADMIN_PASSWORD are not set as repository secrets; live smoke skipped. Add them under Settings -> Secrets and variables -> Actions."
      - name: Run read-only module smoke
        if: env.ADMIN_EMAIL != '' && env.ADMIN_PASSWORD != ''
        run: node scripts/ci/moduleSmoke.mjs
