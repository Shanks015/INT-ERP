name: Keep Alive Ping

on:
  schedule:
    # Run every 12 minutes to keep the Render app active (Render shuts down after 15 mins of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  ping:
    name: Ping Render Web Service
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging server to keep it awake..."
          # Attempt to ping both the default Render URL and the custom domain to ensure one succeeds
          curl -f -s https://int-erp.onrender.com/api/health || curl -f -s https://int-erp.edgeone.app/api/health || echo "Ping failed, but that's okay!"
